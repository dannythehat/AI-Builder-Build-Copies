name: Generate a short Pocket Tetris sharing link

on:
  push:
    paths:
      - '.github/workflows/publish-tetris-shortlink.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shorten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create and verify short link
        env:
          TARGET: https://raw.githack.com/dannythehat/AI-Builder-Build-Copies/main/play/index.html
        shell: bash
        run: |
          set -euo pipefail
          echo "Game target: $TARGET"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location --max-time 20 "$TARGET" | grep -q 'Game Boy Tetris'; then
              echo 'Game is accessible and is the standalone version.'
              break
            fi
            if [ "$attempt" = 5 ]; then echo 'Game could not be verified'; exit 1; fi
            sleep 6
          done
          short="$(curl --fail --silent --show-error --get --max-time 30 \
            --data-urlencode 'format=simple' \
            --data-urlencode "url=$TARGET" \
            'https://is.gd/create.php')"
          if [[ ! "$short" =~ ^https://is\.gd/[A-Za-z0-9_]+$ ]]; then
            echo "Short-link creation did not return a valid URL: $short"
            exit 1
          fi
          echo "Created short sharing link: $short"
          echo "## Pocket Tetris share link: $short" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p play
          printf '%s\n' "$short" > play/SHARE_LINK.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add play/SHARE_LINK.txt
          git commit -m 'Publish verified short Game Boy Tetris sharing link'
          git push

name: Import pinned Craft Anything source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-craft-anything.yml'
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'dannythehat/AI-Builder-Build-Copies'
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Mirror pinned source, preserving workflow upload for separate authorisation
        shell: bash
        run: |
          set -euo pipefail
          PIN='7a0d7de0e4343dac35acb58cc64d021febcb7157'
          SOURCE="$RUNNER_TEMP/craft-anything-source"
          git init -q "$SOURCE"
          git -C "$SOURCE" remote add origin https://github.com/storytold/craft-anything.git
          git -C "$SOURCE" fetch --depth=1 --no-tags origin "$PIN"
          git -C "$SOURCE" checkout -q --detach FETCH_HEAD
          test "$(git -C "$SOURCE" rev-parse HEAD)" = "$PIN"
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/' "$SOURCE/" "$GITHUB_WORKSPACE/"
          cd "$GITHUB_WORKSPACE"
          git add -A
          git -C "$SOURCE" ls-tree -r HEAD | grep -v $'\t.github/workflows/' > "$RUNNER_TEMP/expected-tracked"
          git ls-tree -r "$(git write-tree)" | grep -v $'\t.github/workflows/' > "$RUNNER_TEMP/actual-tracked"
          diff -u "$RUNNER_TEMP/expected-tracked" "$RUNNER_TEMP/actual-tracked"
          echo 'All non-workflow source paths and Git blob hashes match upstream exactly.'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Import Craft Anything source at 7a0d7de (workflow files to follow)'
          git push origin HEAD:main
